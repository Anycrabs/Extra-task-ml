# Конфигурация модуля проверки тест-кейсов.
# Запуск: python -m tc_tools.checker -c configs/check.yaml
# Любой параметр можно переопределить аргументом командной строки (см. --help).
# Относительные пути считаются от папки, из которой запускается модуль.

# Входные файлы решений: файлы и/или папки (из папок берутся *.txt)
inputs:
  - examples/solutions
recursive: false            # искать файлы во вложенных папках

# Переводы строк: во входных файлах auto|crlf|lf|cr, в создаваемых crlf|lf|cr
input_eol: auto
output_eol: crlf

timeout: 5                  # ограничение времени на один тест-кейс, секунд
jobs: 4                     # сколько заданий проверять параллельно
python: null                # интерпретатор для запуска решений (null — текущий)

reports_dir: out/reports    # папка для отчётов
log_dir: out/logs           # папка для логов

xlsx: true                  # сводный отчёт Отчет_<Метка>_results.xlsx
dashboard: true             # HTML-дашборд Отчет_<Метка>_dashboard.html
tc_all_skip_passed: false   # не включать в _tc_all.log файлы без ошибок

# Фильтры сводного отчёта и дашборда (пустой список — без ограничений)
groups: []                  # например: [М24-512]
students: []                # например: [ИвановИИ, ПетровПП]
file_numbers: []            # например: [2, 3]
